<!DOCTYPE html>
<html>

<head>
    <title>SignalR Test</title>
    <!-- Use reliable CDN for signalr.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/6.0.1/signalr.min.js"></script>
</head>

<body>
    <h1>SignalR Notification Test</h1>
    <div id="status">Disconnected</div>
    <ul id="messagesList"></ul>

    <script>
        const connection = new signalr.HubConnectionBuilder()
            .withUrl("http://localhost:5246/notificationHub")
            .configureLogging(signalr.LogLevel.Information)
            .build();

        // Updated to match your server code: "ReceiveNotification"
        connection.on("ReceiveNotification", (message) => {
            const li = document.createElement("li");
            li.textContent = `${new Date().toLocaleTimeString()}: ${message}`;
            document.getElementById("messagesList").appendChild(li);
        });

        connection.start()
            .then(() => document.getElementById("status").textContent = "Connected!")
            .catch(err => document.getElementById("status").textContent = "Error: " + err.toString());
    </script>
</body>

</html>
